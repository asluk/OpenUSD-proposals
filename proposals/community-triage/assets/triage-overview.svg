<text x="136" y="726" font-size="25" font-weight="700" style="fill:#102B50">Composition &amp; scale</text>
<text x="136" y="757" font-size="21" font-weight="400" style="fill:#102B50">Variants, instancing,</text>
<text x="136" y="784" font-size="21" font-weight="400" style="fill:#102B50">and animation timing.</text>
<rect x="609" y="689" width="543" height="114" rx="16" fill="#fff" stroke="#D3E6F2"/>

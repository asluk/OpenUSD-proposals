</g>
<text x="71" y="440" font-size="21" font-weight="700" fill="#102B50" style="fill:#102B50">AGENTS PREPARE</text>
<text x="71" y="477" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Read · connect · refresh</text>
<text x="71" y="506" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Source-linked findings</text>
<text x="71" y="535" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Revisions and evidence gaps</text>
<rect x="424" y="345" width="352" height="212" rx="14" fill="#fff"/>
<g transform="translate(447 365)">
<circle cx="17" cy="17" r="16" fill="none" stroke="#2091D0" stroke-width="3"/>
<path d="M29 29 L45 45 M9 17 L15 23 L26 10" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="447" y="440" font-size="21" font-weight="700" fill="#102B50" style="fill:#102B50">CONTRIBUTORS VALIDATE</text>
<text x="447" y="477" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Check · reproduce · refine</text>
<text x="447" y="506" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Requirements and alternatives</text>
<text x="447" y="535" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Focused decision questions</text>

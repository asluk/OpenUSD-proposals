<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc">
<title id="title">Turn community needs into verified outcomes</title>
<desc id="desc">OpenUSD community triage working draft. October 3–4, 2026 snapshot: 4,391 inventoried items, 1,081 open items, 26 preliminary recommendations. 587 of 728 open OpenUSD issues had no update for at least one year. Four candidate portfolios, three first actions, and an evidence review loop inform future Pixar and TAC discussion.</desc>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#102B50} .small{font-size:20px} .body{font-size:23px} .label{font-size:22px;font-weight:700} .title{font-size:49px;font-weight:700}</style>

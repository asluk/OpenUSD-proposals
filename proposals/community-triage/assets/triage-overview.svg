<text x="141" y="286" font-size="43" font-weight="700" style="fill:#0555B6">4,391</text>
<text x="73" y="322" font-size="22" font-weight="700" style="fill:#102B50">items inventoried</text>
<text x="73" y="350" font-size="19" font-weight="400" style="fill:#102B50">Three repositories</text>

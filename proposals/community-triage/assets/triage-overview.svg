<text x="48" y="101" font-size="49" font-weight="700" style="fill:#FFFFFF">Turn community needs</text>
<text x="48" y="156" font-size="49" font-weight="700" style="fill:#FFFFFF">into verified outcomes</text>
<text x="49" y="185" font-size="22" font-weight="400" style="fill:#D6EDFF">Requests → existing work → decisions → roadmap evidence</text>

<text x="697" y="595" font-size="25" font-weight="700" style="fill:#102B50">Hydra reliability</text>
<text x="697" y="626" font-size="21" font-weight="400" style="fill:#102B50">Material bindings, nested instances,</text>
<text x="697" y="653" font-size="21" font-weight="400" style="fill:#102B50">and consistent live edits.</text>
<rect x="48" y="689" width="543" height="114" rx="16" fill="#fff" stroke="#D3E6F2"/>
<g transform="translate(70 713)">

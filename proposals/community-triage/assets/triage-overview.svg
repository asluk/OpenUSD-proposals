<text x="823" y="477" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Design · prioritize · disposition</text>
<text x="823" y="506" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Existing maintainers and</text>
<text x="823" y="535" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">relevant standards forums</text>

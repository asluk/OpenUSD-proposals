<text x="136" y="626" font-size="21" font-weight="400" style="fill:#102B50">Portable CMake, development trees,</text>
<text x="136" y="653" font-size="21" font-weight="400" style="fill:#102B50">and useful Python packages.</text>
<rect x="609" y="558" width="543" height="114" rx="16" fill="#fff" stroke="#D3E6F2"/>
<g transform="translate(631 582)">

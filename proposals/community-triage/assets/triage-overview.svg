<text x="697" y="726" font-size="25" font-weight="700" style="fill:#102B50">Metadata &amp; presentation</text>
<text x="697" y="757" font-size="21" font-weight="400" style="fill:#102B50">Shader UI, text, LineStyle,</text>
<text x="697" y="784" font-size="21" font-weight="400" style="fill:#102B50">and localization.</text>
<text x="48" y="840" font-size="22" font-weight="700" style="fill:#0555B6">START WITH USEFUL, REVIEWABLE ACTIONS</text>
<rect x="48" y="862" width="356" height="137" rx="16" fill="#FFFFFF" stroke="#D3E6F2"/>
<text x="71" y="896" font-size="23" font-weight="700" style="fill:#2091D0">01</text>
<text x="71" y="930" font-size="22" font-weight="700" style="fill:#102B50">Reconcile superseded work</text>
<text x="71" y="960" font-size="20" font-weight="400" style="fill:#102B50">Compare residual needs</text>
<text x="71" y="986" font-size="20" font-weight="400" style="fill:#102B50">with incorporated fixes.</text>
<rect x="422" y="862" width="356" height="137" rx="16" fill="#FFFFFF" stroke="#D3E6F2"/>
<text x="445" y="896" font-size="23" font-weight="700" style="fill:#2091D0">02</text>
<text x="445" y="930" font-size="22" font-weight="700" style="fill:#102B50">Revalidate behavior</text>
<text x="445" y="960" font-size="20" font-weight="400" style="fill:#102B50">Reproduce and measure</text>
<text x="445" y="986" font-size="20" font-weight="400" style="fill:#102B50">on current revisions.</text>
<rect x="796" y="862" width="356" height="137" rx="16" fill="#FFFFFF" stroke="#D3E6F2"/>
<text x="819" y="896" font-size="23" font-weight="700" style="fill:#2091D0">03</text>
<text x="819" y="930" font-size="22" font-weight="700" style="fill:#102B50">Advance existing PRs</text>
<text x="819" y="960" font-size="20" font-weight="400" style="fill:#102B50">Verify each requirement</text>
<text x="819" y="986" font-size="20" font-weight="400" style="fill:#102B50">before proposing new work.</text>
<text x="48" y="1028" font-size="21" font-weight="700" style="fill:#102B50">Urgent correctness and security reports take precedence.</text>
<text x="48" y="1076" font-size="22" font-weight="700" style="fill:#0555B6">A LIVING EVIDENCE LOOP</text>

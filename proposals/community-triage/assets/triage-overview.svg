<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
<title id="title">From community needs to shared capabilities</title>
<desc id="desc">Continuous OpenUSD community triage: agents prepare, contributors validate, and existing maintainers and standards authorities decide. Living records connect requirements to implementation, independent extensions, standards, or infrastructure; preserve deferrals; and follow accepted work through verification, release, and adoption.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#102B50}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2091D0"/></marker></defs>
<rect x="0" y="0" width="1200" height="1450" rx="0" fill="#F6FAFD"/>
<rect x="0" y="0" width="1200" height="205" rx="0" fill="#0555B6"/>
<polygon points="915,0 1200,0 1200,196" fill="#34C6F3" opacity="0.15"/>
<polygon points="963,0 1200,0 1200,151" fill="#34C6F3" opacity="0.22"/>
<polygon points="1008,0 1200,0 1200,109" fill="#34C6F3" opacity="0.3"/>
<text x="48" y="42" font-size="20" font-weight="700" fill="#fff" style="fill:#fff">OPENUSD COMMUNITY TRIAGE  /  PROPOSED OPERATING MODEL</text>
<text x="48" y="101" font-size="49" font-weight="700" fill="#fff" style="fill:#fff">From community needs</text>
<text x="48" y="156" font-size="49" font-weight="700" fill="#fff" style="fill:#fff">to shared capabilities</text>
<text x="48" y="187" font-size="23" font-weight="400" fill="#fff" style="fill:#fff">Continuity across participation, decisions, and delivered outcomes.</text>
<rect x="48" y="233" width="1104" height="76" rx="14" fill="#E8F4FA"/>
<text x="70" y="263" font-size="20" font-weight="700" fill="#102B50" style="fill:#102B50">COMMUNITY NEEDS &amp; CHANGED EVIDENCE</text>
<text x="70" y="292" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Use cases  ·  Experiments  ·  Reports  ·  Proposals  ·  Implementation  ·  Interoperability</text>
<path d="M600 311 V325 H224 V337" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="345" width="352" height="212" rx="14" fill="#fff"/>
<g transform="translate(71 365)">

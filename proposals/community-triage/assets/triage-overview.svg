<path d="M778 395 H795" fill="none" stroke="#2091D0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M224 558 V577" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M600 558 V577" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M976 558 V577" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="589" width="1104" height="87" rx="14" fill="#102B50"/>
<text x="70" y="622" font-size="22" font-weight="700" fill="#fff" style="fill:#fff">LIVING RECORD: NEED → EVIDENCE → DECISION → OUTCOME</text>
<text x="70" y="654" font-size="21" font-weight="400" fill="#fff" style="fill:#fff">Preserve rationale, dependencies, objections, pending questions, and residual needs.</text>
<path d="M600 677 V703" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="733" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">CHOOSE AN APPROPRIATE PATH</text>
<rect x="48" y="752" width="264" height="111" rx="14" fill="#E8F4FA"/>
<text x="66" y="783" font-size="18" font-weight="700" fill="#102B50" style="fill:#102B50">REFERENCE</text>
<text x="66" y="820" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">Implementation</text>
<text x="66" y="848" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">and integration</text>
<rect x="328" y="752" width="264" height="111" rx="14" fill="#E8F4FA"/>
<text x="346" y="783" font-size="18" font-weight="700" fill="#102B50" style="fill:#102B50">INDEPENDENT</text>
<text x="346" y="820" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">Extensions and</text>
<text x="346" y="848" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">domain experiments</text>
<rect x="608" y="752" width="264" height="111" rx="14" fill="#E8F4FA"/>
<text x="626" y="783" font-size="18" font-weight="700" fill="#102B50" style="fill:#102B50">SHARED AGREEMENT</text>
<text x="626" y="820" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">Specification and</text>
<text x="626" y="848" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">interoperability</text>
<rect x="888" y="752" width="264" height="111" rx="14" fill="#E8F4FA"/>
<text x="906" y="783" font-size="18" font-weight="700" fill="#102B50" style="fill:#102B50">SUPPORTING WORK</text>
<text x="906" y="820" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">Tests, tools, builds,</text>
<text x="906" y="848" font-size="22" font-weight="400" fill="#102B50" style="fill:#102B50">and infrastructure</text>
<rect x="48" y="887" width="1104" height="70" rx="14" fill="#fff"/>
<text x="70" y="914" font-size="23" font-weight="700" fill="#102B50" style="fill:#102B50">A useful disposition can also defer, decline, or route a need.</text>
<text x="70" y="942" font-size="21" font-weight="400" fill="#102B50" style="fill:#102B50">Record authorized rationale and revisit conditions; confirm handoffs.</text>
<path d="M600 959 V987" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g transform="translate(70 1014)">
<path d="M0 10 L22 0 L44 10 L22 20 Z" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M0 20 L22 10 L44 20 L22 30 Z" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M0 30 L22 20 L44 30 L22 40 Z" fill="none" stroke="#2091D0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="137" y="1022" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">FOLLOW ACCEPTED WORK THROUGH</text>
<text x="137" y="1057" font-size="24" font-weight="400" fill="#102B50" style="fill:#102B50">Implementation → Verification → Release → Evidenced adoption</text>
<path d="M48 1050 H26 V276 H43" fill="none" stroke="#2091D0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="1110" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">LEARN FROM OUTCOMES AND REFRESH THE RECORD</text>
<rect x="48" y="1132" width="264" height="133" rx="14" fill="#fff"/>
<text x="66" y="1167" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">Broader coverage</text>
<text x="66" y="1204" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">Historical and incoming</text>
<text x="66" y="1233" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">needs stay visible.</text>
<rect x="328" y="1132" width="264" height="133" rx="14" fill="#fff"/>
<text x="346" y="1167" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">Useful reuse</text>
<text x="346" y="1204" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">Existing work serves</text>
<text x="346" y="1233" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">independent requirements.</text>
<rect x="608" y="1132" width="264" height="133" rx="14" fill="#fff"/>
<text x="626" y="1167" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">Focused decisions</text>
<text x="626" y="1204" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">Experts receive evidence</text>
<text x="626" y="1233" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">and precise questions.</text>
<rect x="888" y="1132" width="264" height="133" rx="14" fill="#fff"/>
<text x="906" y="1167" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">Roadmap learning</text>
<text x="906" y="1204" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">Unmet needs and</text>
<text x="906" y="1233" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">dependencies guide work.</text>
<rect x="48" y="1290" width="1104" height="63" rx="14" fill="#E8F4FA"/>
<text x="70" y="1328" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">MEASURE: validated coverage · evidence quality · total effort · verified outcomes</text>
<text x="48" y="1385" font-size="22" font-weight="700" fill="#102B50" style="fill:#102B50">Working proposal for Pixar/OpenUSD and relevant AOUSD discussion.</text>
<text x="48" y="1416" font-size="20" font-weight="400" fill="#102B50" style="fill:#102B50">Existing decision authority applies. Benefits require measured operation.</text>
</svg>
